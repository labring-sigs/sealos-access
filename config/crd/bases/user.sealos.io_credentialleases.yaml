apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: credentialleases.user.sealos.io
spec:
  group: user.sealos.io
  names:
    kind: CredentialLease
    listKind: CredentialLeaseList
    plural: credentialleases
    singular: credentiallease
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Profile
      type: string
      jsonPath: .spec.profile
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Expires
      type: date
      jsonPath: .status.expirationTimestamp
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - target
            - requester
            - profile
            - requestedTTLSeconds
            properties:
              target:
                type: object
                required:
                - issuer
                - subject
                properties:
                  issuer:
                    type: string
                  subject:
                    type: string
              requester:
                type: object
                required:
                - issuer
                - subject
                properties:
                  issuer:
                    type: string
                  subject:
                    type: string
              profile:
                type: string
                enum:
                - base-readonly.v1
                - cluster-ops-write.v1
              requestedTTLSeconds:
                type: integer
                format: int64
              approvalReference:
                type: string
              approvalID:
                type: string
              approvalReason:
                type: string
          status:
            type: object
            properties:
              phase:
                type: string
                enum:
                - Pending
                - AwaitingRedemption
                - Prepared
                - Issued
                - Failed
                - Revoked
                - Expired
              serviceAccountRef:
                type: object
                properties:
                  apiVersion:
                    type: string
                  fieldPath:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                  resourceVersion:
                    type: string
                  uid:
                    type: string
              boundSecretRef:
                type: object
                properties:
                  apiVersion:
                    type: string
                  fieldPath:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                  resourceVersion:
                    type: string
                  uid:
                    type: string
              bindingRef:
                type: object
                properties:
                  apiVersion:
                    type: string
                  fieldPath:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                  resourceVersion:
                    type: string
                  uid:
                    type: string
              consumedAt:
                type: string
                format: date-time
              approvalExpirationTimestamp:
                type: string
                format: date-time
              redeemedAt:
                type: string
                format: date-time
              expirationTimestamp:
                type: string
                format: date-time
              conditions:
                type: array
                items:
                  type: object
                  required:
                  - status
                  - type
                  properties:
                    lastTransitionTime:
                      type: string
                      format: date-time
                    message:
                      type: string
                    observedGeneration:
                      type: integer
                      format: int64
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
    subresources:
      status: {}

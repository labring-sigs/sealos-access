apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-user-controller-leader-election
  namespace: access-controller-system
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups:
  - ""
  resources:
  - events
  verbs: [create, patch]

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: internal-user-base-readonly-v1
  labels:
    user.sealos.io/credential-profile: base-readonly.v1
    user.sealos.io/profile-version: v1
rules:
- apiGroups: [""]
  resources: [pods, services]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments, replicasets]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: internal-user-cluster-ops-write-v1
  labels:
    user.sealos.io/credential-profile: cluster-ops-write.v1
    user.sealos.io/profile-version: v1
rules:
- apiGroups: [""]
  resources: [pods, services]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments, replicasets]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]

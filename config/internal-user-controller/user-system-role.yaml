apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: internal-user-controller-resources
  namespace: access-system
rules:
- apiGroups: [""]
  resources: [serviceaccounts, secrets]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]

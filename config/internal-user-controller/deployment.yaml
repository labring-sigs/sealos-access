apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-user-controller
  namespace: access-controller-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-user-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: internal-user-controller
    spec:
      serviceAccountName: internal-user-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: controller
        image: ghcr.io/labring/sealos-internal-user-controller:latest
        imagePullPolicy: IfNotPresent
        command: [/internal-user-controller]
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        ports:
        - name: webhook-server
          containerPort: 9443
        - name: health
          containerPort: 8081
        env:
        - name: INTERNAL_USER_OIDC_ISSUERS
          valueFrom:
            configMapKeyRef:
              name: internal-user-controller-config
              key: oidc-issuers
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: webhook-certs
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
      volumes:
      - name: webhook-certs
        secret:
          secretName: internal-user-controller-webhook-cert

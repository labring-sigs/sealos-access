apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: internal-user-admission-validating
  annotations:
    cert-manager.io/inject-ca-from: access-controller-system/internal-user-admission-cert
webhooks:
- name: rbac.internal-user.sealos.io
  admissionReviewVersions: [v1]
  failurePolicy: Fail
  matchPolicy: Exact
  sideEffects: None
  timeoutSeconds: 5
  clientConfig:
    service:
      name: internal-user-admission
      namespace: access-controller-system
      path: /validate
      port: 443
  rules:
  - apiGroups: [rbac.authorization.k8s.io]
    apiVersions: [v1]
    operations: [CREATE, UPDATE, DELETE]
    resources: [clusterrolebindings]
    scope: Cluster

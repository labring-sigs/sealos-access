apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-user-admission
  namespace: access-controller-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-user-admission
  template:
    metadata:
      labels:
        app.kubernetes.io/name: internal-user-admission
    spec:
      serviceAccountName: internal-user-admission
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: admission
        image: ghcr.io/labring/sealos-internal-user-admission:latest
        imagePullPolicy: IfNotPresent
        command: [/internal-user-admission]
        args:
        - --listen-address=:8443
        - --tls-cert-file=/tls/tls.crt
        - --tls-key-file=/tls/tls.key
        ports:
        - name: https
          containerPort: 8443
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        readinessProbe:
          httpGet:
            scheme: HTTPS
            path: /readyz
            port: https
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            scheme: HTTPS
            path: /healthz
            port: https
          initialDelaySeconds: 10
          periodSeconds: 15
        volumeMounts:
        - name: serving-cert
          mountPath: /tls
          readOnly: true
      volumes:
      - name: serving-cert
        secret:
          secretName: internal-user-admission-cert

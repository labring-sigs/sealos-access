apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: internal-credential-broker-selfsigned
  namespace: access-broker-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-credential-broker-tls
  namespace: access-broker-system
spec:
  secretName: internal-credential-broker-tls
  dnsNames:
  - internal-credential-broker.access-broker-system.svc
  - internal-credential-broker.access-broker-system.svc.cluster.local
  issuerRef:
    name: internal-credential-broker-selfsigned
    kind: Issuer

{{- if .Values.admission.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: internal-user-admission-validating
  labels:
{{ include "sealos-access-target-cluster.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Values.namespaces.controller }}/{{ .Values.admission.tls.certificateName }}
webhooks:
- name: rbac.internal-user.sealos.io
  admissionReviewVersions: [v1]
  failurePolicy: Fail
  matchPolicy: Exact
  sideEffects: None
  timeoutSeconds: 5
  clientConfig:
    service:
      name: {{ .Values.admission.name }}
      namespace: {{ .Values.namespaces.controller }}
      path: /validate
      port: 443
  rules:
  - apiGroups: [rbac.authorization.k8s.io]
    apiVersions: [v1]
    operations: [CREATE, UPDATE, DELETE]
    resources: [clusterrolebindings]
    scope: Cluster
{{- end }}

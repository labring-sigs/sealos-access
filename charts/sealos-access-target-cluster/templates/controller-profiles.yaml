{{- if .Values.controller.enabled }}
{{- range .Values.profiles }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .name }}
  labels:
{{ include "sealos-access-target-cluster.labels" $ | nindent 4 }}
{{ toYaml .labels | nindent 4 }}
rules:
{{ toYaml .rules | nindent 2 }}
---
{{- end }}
{{- end }}

{{- if .Values.admission.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.admission.name }}
  namespace: {{ .Values.namespaces.controller }}
  labels:
{{ include "sealos-access-target-cluster.labels" . | nindent 4 }}
{{ include "sealos-access-target-cluster.admissionSelectorLabels" . | nindent 4 }}
  {{- with .Values.admission.podAnnotations }}
  annotations:
{{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.admission.replicaCount }}
  selector:
    matchLabels:
{{ include "sealos-access-target-cluster.admissionSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
{{ include "sealos-access-target-cluster.admissionSelectorLabels" . | nindent 8 }}
{{ include "sealos-access-target-cluster.labels" . | nindent 8 }}
      {{- with .Values.admission.podAnnotations }}
      annotations:
{{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.admission.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.admission.name }}
      automountServiceAccountToken: true
      securityContext:
{{ toYaml .Values.admission.podSecurityContext | nindent 8 }}
      containers:
      - name: admission
        image: "{{ .Values.admission.image.repository }}:{{ .Values.admission.image.tag }}"
        imagePullPolicy: {{ .Values.admission.image.pullPolicy }}
        command:
        - /internal-user-admission
        args:
        - --listen-address=:8443
        - --tls-cert-file=/tls/tls.crt
        - --tls-key-file=/tls/tls.key
        ports:
        - name: https
          containerPort: 8443
        securityContext:
{{ toYaml .Values.admission.containerSecurityContext | nindent 10 }}
        resources:
{{ toYaml .Values.admission.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            scheme: HTTPS
            path: /readyz
            port: https
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            scheme: HTTPS
            path: /healthz
            port: https
          initialDelaySeconds: 10
          periodSeconds: 15
        volumeMounts:
        - name: serving-cert
          mountPath: /tls
          readOnly: true
      volumes:
      - name: serving-cert
        secret:
          secretName: {{ .Values.admission.tls.secretName }}
      {{- with .Values.admission.nodeSelector }}
      nodeSelector:
{{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.admission.affinity }}
      affinity:
{{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.admission.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

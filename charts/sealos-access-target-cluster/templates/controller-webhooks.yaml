{{- if .Values.controller.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: internal-user-controller-mutating
  labels:
{{ include "sealos-access-target-cluster.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Values.namespaces.controller }}/{{ .Values.controller.tls.certificateName }}
webhooks:
- name: minternaluser.internal-user.sealos.io
  admissionReviewVersions: [v1]
  failurePolicy: Fail
  sideEffects: None
  clientConfig:
    service:
      name: internal-user-controller-webhook
      namespace: {{ .Values.namespaces.controller }}
      path: /mutate-access-sealos-io-v1-internaluser
  rules:
  - apiGroups: [access.sealos.io]
    apiVersions: [v1]
    operations: [CREATE, UPDATE]
    resources: [internalusers]
- name: mcredentiallease.internal-user.sealos.io
  admissionReviewVersions: [v1]
  failurePolicy: Fail
  sideEffects: None
  clientConfig:
    service:
      name: internal-user-controller-webhook
      namespace: {{ .Values.namespaces.controller }}
      path: /mutate-access-sealos-io-v1-credentiallease
  rules:
  - apiGroups: [access.sealos.io]
    apiVersions: [v1]
    operations: [CREATE, UPDATE]
    resources: [credentialleases]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: internal-user-controller-validating
  labels:
{{ include "sealos-access-target-cluster.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Values.namespaces.controller }}/{{ .Values.controller.tls.certificateName }}
webhooks:
- name: vinternaluser.internal-user.sealos.io
  admissionReviewVersions: [v1]
  failurePolicy: Fail
  sideEffects: None
  clientConfig:
    service:
      name: internal-user-controller-webhook
      namespace: {{ .Values.namespaces.controller }}
      path: /validate-access-sealos-io-v1-internaluser
  rules:
  - apiGroups: [access.sealos.io]
    apiVersions: [v1]
    operations: [CREATE, UPDATE, DELETE]
    resources: [internalusers]
- name: vcredentiallease.internal-user.sealos.io
  admissionReviewVersions: [v1]
  failurePolicy: Fail
  sideEffects: None
  clientConfig:
    service:
      name: internal-user-controller-webhook
      namespace: {{ .Values.namespaces.controller }}
      path: /validate-access-sealos-io-v1-credentiallease
  rules:
  - apiGroups: [access.sealos.io]
    apiVersions: [v1]
    operations: [CREATE, UPDATE, DELETE]
    resources: [credentialleases]
{{- end }}

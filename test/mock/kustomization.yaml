# Deploy all mock/simulation components for end-to-end testing.
#
# Usage:
#   kubectl apply -k ./test/mock
#
# This deploys into the "access-mock" namespace:
#   - test-oidc-provider    (OIDC issuer for Broker authentication)
#   - mock-approval-server  (external approval system API mock)
#   - mailhog               (SMTP relay for approval email notifications)
#   - sealos-access         (debug pod with the unified CLI for interactive testing)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - oidc-provider/deploy
  - approval-server/deploy
  - mailhog/deploy
  - cli/deploy

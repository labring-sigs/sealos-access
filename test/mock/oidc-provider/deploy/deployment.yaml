apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-oidc-provider
  namespace: access-mock
  labels:
    app.kubernetes.io/name: test-oidc-provider
    app.kubernetes.io/part-of: internal-user-credentials
    app.kubernetes.io/component: mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: test-oidc-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-oidc-provider
        app.kubernetes.io/part-of: internal-user-credentials
        app.kubernetes.io/component: mock
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: test-oidc-provider
          image: test-oidc-provider:latest
          args:
            - -listen-address
            - :8080
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: SEALOS_TEST_OIDC_ADDR
              value: :8080
            - name: SEALOS_TEST_OIDC_CONFIG
              value: |
                {
                  "issuer": "https://test-oidc-provider.access-mock.svc",
                  "users": [
                    {
                      "sub": "test-user-001",
                      "email": "test-user-001@example.internal",
                      "name": "Test User One"
                    },
                    {
                      "sub": "test-user-002",
                      "email": "test-user-002@example.internal",
                      "name": "Test User Two"
                    }
                  ],
                  "clients": [
                    {
                      "client_id": "test-oidc-client",
                      "redirect_uris": ["http://localhost:8080/callback"]
                    }
                  ],
                  "token_audience": "test-oidc-audience",
                  "token_ttl_seconds": 300
                }

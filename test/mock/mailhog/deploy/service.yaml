apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: access-mock
  labels:
    app.kubernetes.io/name: mailhog
    app.kubernetes.io/part-of: internal-user-credentials
    app.kubernetes.io/component: mock
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailhog
  ports:
    - name: smtp
      protocol: TCP
      port: 1025
      targetPort: 1025
    - name: http
      protocol: TCP
      port: 8025
      targetPort: 8025

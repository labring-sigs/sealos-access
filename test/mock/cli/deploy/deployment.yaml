apiVersion: apps/v1
kind: Deployment
metadata:
  name: sealos-access
  namespace: access-mock
  labels:
    app.kubernetes.io/name: sealos-access
    app.kubernetes.io/part-of: internal-user-credentials
    app.kubernetes.io/component: mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sealos-access
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sealos-access
        app.kubernetes.io/part-of: internal-user-credentials
        app.kubernetes.io/component: mock
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cli
          image: sealos-access:latest
          command:
            - sleep
            - infinity
          env:
            - name: HOME
              value: /home/testuser
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
